<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- A personal log: keep it out of search results if it is ever exposed. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="A self-hosted, mobile-first web app for logging scuba dives, with dive computer profiles, statistics and certification cards."
    />
    <!-- Browser and status bar colour; set below and kept in step by
         ThemeProvider, so it always matches the page background. -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG icons; scripts/apple-touch-icon.ts renders this one. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Served by the server with the instance's SHYLOG_APP_NAME. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Shylog</title>
    <script>
      // Set the theme before first paint so a dark phone does not flash white
      // while React loads. Mirrors ThemeProvider's storage key and values, and
      // falls back to the system setting when storage is blocked.
      {
        let theme = null
        try {
          theme = localStorage.getItem("theme")
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
        // --background of each theme (white, mist-950); CSS isn't loaded yet.
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#090b0c" : "#ffffff")
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
