<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shylog — Recently deleted (hi-fi)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.sl{--font:Geist,ui-sans-serif,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
.sl.f-inter{--font:Inter,ui-sans-serif,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
.sl.f-windows{--font:'Segoe UI Variable Text','Segoe UI',sans-serif;--mono:'Cascadia Mono',Consolas,monospace}
.sl.f-system{--font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,monospace}
.sl{
--background:oklch(1 0 0);--foreground:oklch(0.17 0.006 228);
--muted:oklch(0.966 0.003 210);--muted-foreground:oklch(0.54 0.018 215);
--faint:oklch(0.7 0.012 215);
--hairline:oklch(0.92 0.005 214);
--accent:oklch(0.48 0.09 200);--accent-foreground:oklch(0.99 0.005 200);
--accent-soft:oklch(0.48 0.09 200 / 9%);
--nav:oklch(1 0 0 / 85%);
--card:oklch(1 0 0);--edge:oklch(0.17 0.006 228 / 9%);--shadow-xs:0 1px 2px 0 rgb(0 0 0 / 0.04);
}
.sl.dark{
--background:oklch(0.155 0.006 228);--foreground:oklch(0.97 0.003 200);
--muted:oklch(0.23 0.008 225);--muted-foreground:oklch(0.7 0.014 214);
--faint:oklch(0.5 0.014 214);
--hairline:oklch(1 0 0 / 9%);
--accent:oklch(0.76 0.11 192);--accent-foreground:oklch(0.2 0.03 205);
--accent-soft:oklch(0.76 0.11 192 / 12%);
--nav:oklch(0.155 0.006 228 / 85%);
--card:oklch(0.205 0.008 225);--edge:oklch(1 0 0 / 8%);--shadow-xs:0 1px 2px 0 rgb(0 0 0 / 0.3);
}
.sl.sky{--accent:oklch(0.5 0.134 242.749);--accent-foreground:oklch(0.977 0.013 236.62);--accent-soft:oklch(0.5 0.134 242.749 / 9%)}
.sl.dark.sky{--accent:oklch(0.746 0.16 232.661);--accent-foreground:oklch(0.293 0.066 243.157);--accent-soft:oklch(0.746 0.16 232.661 / 14%)}
.sl.emerald{--accent:oklch(0.508 0.118 165.612);--accent-foreground:oklch(0.979 0.021 166.113);--accent-soft:oklch(0.508 0.118 165.612 / 9%)}
.sl.dark.emerald{--accent:oklch(0.765 0.177 163.223);--accent-foreground:oklch(0.262 0.051 172.552);--accent-soft:oklch(0.765 0.177 163.223 / 14%)}
.sl.cyan{--accent:oklch(0.52 0.105 223.128);--accent-foreground:oklch(0.984 0.019 200.873);--accent-soft:oklch(0.52 0.105 223.128 / 9%)}
.sl.dark.cyan{--accent:oklch(0.789 0.154 211.53);--accent-foreground:oklch(0.302 0.056 229.695);--accent-soft:oklch(0.789 0.154 211.53 / 14%)}
.tn{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--edge),var(--shadow-xs);overflow:hidden}
.sec{margin:0 0 8px;padding:0 4px;font-size:13px;font-weight:600;color:var(--muted-foreground)}
.fl{display:flex;flex-direction:column}
.fl > * + *{border-top:1px solid var(--hairline)}
.frow{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 16px}
.frow > label,.frow > .lbl{flex:none;font-size:14px;color:var(--muted-foreground)}
.fin{flex:1;min-width:0;height:46px;border:0;padding:0;background:none;text-align:right;font-size:16px;font-weight:500;outline:none;font-variant-numeric:tabular-nums}
.fin.fit-t{flex:none;width:46px}.fin.fit-d{flex:none;width:22px}
.fin::placeholder{color:var(--faint);font-weight:400}
.unit{flex:none;min-width:22px;font-size:14px;color:var(--muted-foreground)}
.pick{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;height:46px;border:0;padding:0;background:none;font-size:16px;font-weight:500;text-align:right;cursor:pointer}
.pick svg{flex:none;color:var(--faint)}
.fblock{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.fblock > .lbl{font-size:14px;color:var(--muted-foreground)}
.seg{display:grid;gap:2px;padding:2px;border-radius:10px;background:var(--muted)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:500;color:var(--muted-foreground);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--foreground);box-shadow:0 0 0 1px var(--edge),0 1px 2px rgb(0 0 0 / 0.06)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--muted);font-size:14px;font-weight:500;color:var(--foreground);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ta{width:100%;box-sizing:border-box;min-height:72px;border:0;padding:0;background:none;resize:none;font-size:16px;line-height:1.45;outline:none}
.ta::placeholder{color:var(--faint)}
.hbtn{display:inline-flex;align-items:center;height:44px;padding:0 8px;border:0;background:none;text-decoration:none;font-size:16px;font-weight:500;color:var(--accent);cursor:pointer}
.dcard{display:flex;align-items:center;gap:12px;padding:14px 12px 14px 16px;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--edge),var(--shadow-xs)}
.dlink{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 80px;align-items:center;column-gap:14px;text-decoration:none;color:inherit}
.restore{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border:0;border-radius:18px;font-size:14px;font-weight:500;cursor:pointer}
.xiess .xi2{display:none!important}
.xi{flex:none;display:inline-block;vertical-align:-0.2em;margin-right:0.4em;color:var(--muted-foreground)}
.noxi .xi{display:none!important}
.xdot{display:none!important}
.noxi .xdot{display:inline-block!important}
.xi.none{display:none}
</style>
</helmet>
<div class="{{mode}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: var(--background); color: var(--foreground); font-family: var(--font); font-size: 14px; line-height: 1.4; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased">

<header style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; height: 52px; padding: 0 8px">
<a href="SettingsHifi.dc.html" class="hbtn" style="justify-self: start; gap: 2px; padding-left: 2px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6l6 6"></path></svg>Settings</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.015em">Recently deleted</h1>
<sc-if value="{{offline}}" hint-placeholder-val="{{false}}"><span style="justify-self: end; display: inline-flex; align-items: center; gap: 7px; padding-right: 8px; font-size: 13px; color: var(--muted-foreground)"><span class="xdot" aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: var(--faint)"></span><svg class="xi" width="1.15em" height="1.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:0"><path d="M12 18l.01 0 M9.172 15.172a4 4 0 0 1 5.656 0 M6.343 12.343a7.963 7.963 0 0 1 3.864 -2.14m4.163 .155a7.965 7.965 0 0 1 3.287 2 M3.515 9.515a12 12 0 0 1 3.544 -2.455m3.101 -.92a12 12 0 0 1 10.325 3.374 M3 3l18 18"></path></svg>Offline</span></sc-if>
</header>

<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 40px">
<p style="margin: 0 4px; font-size: 14px; line-height: 1.5; color: var(--muted-foreground)">{{footnote}}</p>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 class="sec" style="margin: 0"><svg class="xi xi2" width="1.15em" height="1.15em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l16 0 M10 11l0 6 M14 11l0 6 M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12 M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"></path></svg>{{g.label}}</h2>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="1">
<div class="dcard">
<a href="DiveDetailHifi.dc.html" class="dlink" aria-label="{{it.openAria}}">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 16px; font-weight: 500; letter-spacing: -0.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.site}}</span>
<span class="tn" style="font-size: 13px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><svg class="xi xi2" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z M16 3v4 M8 3v4 M4 11h16 M11 15h1 M12 15v3"></path></svg><span>{{it.day}}</span></span>
<span class="tn" style="display: flex; align-items: center; gap: 10px; margin-top: 2px; white-space: nowrap; font-size: 13px; color: var(--muted-foreground)"><span style="display: inline-flex; align-items: center; gap: 4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Max depth" role="img"><path d="M4 20l16 0"></path><path d="M12 14l0 -10"></path><path d="M12 14l4 -4"></path><path d="M12 14l-4 -4"></path></svg>{{it.depth}} m</span><span style="display: inline-flex; align-items: center; gap: 4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Duration" role="img"><path d="M6.5 7h11 M6.5 17h11 M6 20v-2a6 6 0 1 1 12 0v2a1 1 0 0 1 -1 1h-10a1 1 0 0 1 -1 -1z M6 4v2a6 6 0 1 0 12 0v-2a1 1 0 0 0 -1 -1h-10a1 1 0 0 0 -1 1z"></path></svg>{{it.dur}} min</span></span>
</span>
<svg width="80" height="24" viewBox="0 0 60 24" preserveAspectRatio="none" fill="none" aria-hidden="true" style="display: block; color: var(--faint)"><polyline points="{{it.pts}}" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>
</a>
<button type="button" class="restore" onClick="{{it.restore}}" disabled="{{offline}}" aria-label="{{it.aria}}" style="background: {{restoreBg}}; color: {{restoreFg}}; cursor: {{restoreCursor}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.06 13a9 9 0 1 0 .49 -4.087 M3 4.001v5h5 M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"></path></svg><span>Restore</span></button>
</div>
</sc-for>
</section>
</sc-for>

</div>
</sc-if>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 40px 120px; text-align: center">
<span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; background: var(--muted); color: var(--muted-foreground)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l16 0"></path><path d="M10 11l0 6"></path><path d="M14 11l0 6"></path><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"></path><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"></path></svg></span>
<p style="margin: 4px 0 0; font-size: 17px; font-weight: 600; letter-spacing: -0.015em">Nothing deleted</p>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted-foreground)">Dives you delete show up here, and you can restore them any time.</p>
</div>
</sc-if>

<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px 0 16px; border-radius: 14px; background: var(--foreground); color: var(--background); box-shadow: 0 8px 24px -8px rgb(0 0 0 / 0.35)">
<span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{toastText}}</span>
<a href="DiveDetailHifi.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 10px; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--background); opacity: 0.85">View</a>
</div>
</sc-if>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props="{&quot;icons&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Off&quot;,&quot;Essential&quot;,&quot;All&quot;],&quot;default&quot;:&quot;Essential&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Some deleted&quot;,&quot;Empty&quot;],&quot;default&quot;:&quot;Some deleted&quot;},&quot;offline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;font&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Geist&quot;,&quot;Inter&quot;,&quot;System (SF)&quot;,&quot;Windows (Segoe UI)&quot;],&quot;default&quot;:&quot;Geist&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Teal&quot;,&quot;Sky 700&quot;,&quot;Cyan 700&quot;,&quot;Emerald 700&quot;],&quot;default&quot;:&quot;Cyan 700&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { restored: [] };
}
renderVals() {
var self = this;
var s = this.state || {};
var p = this.props || {};
var offline = !!p.offline;
var restored = s.restored || [];
var all = [
{ id: 'd1', group: 'Deleted today', date: 'Sat 10 Oct 2026 · 14:10', day: 'Sat 10 Oct 2026', site: 'Partridge Point', place: "Simon's Town", depth: '6.0', dur: '12', p: [0, 4, 6, 5.6, 5, 4.4, 3, 2, 0] },
{ id: 'd2', group: 'Deleted in August', date: 'Sun 27 Jul 2026 · 07:30', day: 'Sun 27 Jul 2026', site: 'Seven Mile Reef', place: 'Sodwana', depth: '18.2', dur: '47', p: [0, 11, 17, 18.2, 16, 14, 12, 10, 8, 5, 5, 0] },
{ id: 'd3', group: 'Deleted in April', date: 'Sat 4 Apr 2026 · 10:00', day: 'Sat 4 Apr 2026', site: 'A-Frame', place: "Simon's Town", depth: '11.4', dur: '38', p: [0, 7, 11, 11.4, 10, 9, 8, 6, 5, 4, 4, 0] }
];
var items = (p.state ?? 'Some deleted') === 'Empty' ? [] : all.filter(function (d) { return restored.indexOf(d.id) < 0; });
var groups = [];
items.forEach(function (d) {
var g = groups.filter(function (x) { return x.label === d.group; })[0];
if (!g) { g = { label: d.group, items: [] }; groups.push(g); }
g.items.push(Object.assign({}, d, {
aria: 'Restore ' + d.site + ', ' + d.date,
openAria: d.site + ', ' + d.date + '. Open',
pts: (function (pr) { var step = 58 / (pr.length - 1); return pr.map(function (v, i) { return (1 + i * step).toFixed(1) + ',' + (2 + Math.min(v, 35) / 35 * 20).toFixed(1); }).join(' '); })(d.p),
restore: function () { if (offline) return; self.setState({ restored: restored.concat([d.id]), last: d.site }); }
}));
});
return {
mode: ({ 'Off': 'noxi ', 'All': '' }[(this.props || {}).icons] ?? ((this.props || {}).icons === false ? 'noxi ' : 'xiess ')) + 'sl' + (p.dark ? ' dark' : '') + ({ 'Sky 700': ' sky', 'Emerald 700': ' emerald', 'Cyan 700': ' cyan' }[p.accent ?? 'Cyan 700'] || '') + ({ 'Inter': ' f-inter', 'System (SF)': ' f-system', 'Windows (Segoe UI)': ' f-windows' }[p.font ?? 'Geist'] || ''),
offline: offline,
hasItems: items.length > 0,
empty: items.length === 0,
groups: groups,
restoreBg: offline ? 'var(--muted)' : 'var(--accent-soft)',
restoreFg: offline ? 'var(--faint)' : 'var(--accent)',
restoreCursor: offline ? 'default' : 'pointer',
footnote: offline ? 'Restoring needs a connection.' : 'A restored dive goes back into your log and gets its number back in date order.',
toast: !!s.last && restored.length > 0,
toastText: s.last ? s.last + ' is back in your log' : ''
};
}
}
</script>
</body>
</html>
