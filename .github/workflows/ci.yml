name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push cancels the branch's running CI, main included. Cutting a
# publish short is safe: each tag moves only when its manifest lands, so
# :latest stays on the last finished image until the newer run replaces it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two jobs so a failing check doesn't hide the browser results, and the
# browser tests run alongside the fast checks. Actions are
# pinned to commit SHAs, so a moved or hijacked tag can't change what runs.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the release with pnpm 12 support; the v6 tag still points
      # at v6.0.10 (pnpm/action-setup#289).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # xsltproc runs Subsurface's UDDF import in the tests; xmllint is for
      # UDDF schema validation once the export exists. A stalled mirror
      # (see e2e) fails this step fast instead of the whole job.
      - run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends xsltproc libxml2-utils
        timeout-minutes: 3
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --coverage
      - name: Add coverage to the job summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage.txt') != '' }}
        run: |
          {
            echo "## Coverage"
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build

  # Sharded, as two workers took over five minutes while the other jobs
  # finish in three. Playwright splits by test count, not duration.
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A failing shard leaves the others running, to show every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Browsers and their system libraries come with the image, as apt from
    # the runner's Ubuntu mirror stalled past the timeout. Its version must
    # match @playwright/test in the lockfile; bump both together. e2e-repeat
    # reuses it through the anchor.
    container: &playwright
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: e2e
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3
      - if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            apps/web/e2e/__screenshots__/
          retention-days: 14

  # The browser spec files a pull request adds or changes, for e2e-repeat.
  # A job of its own, so a PR that changes none skips the repeat outright.
  e2e-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      specs: ${{ steps.specs.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge into the base, whose first
          # parent is the base, so two commits are enough to diff.
          fetch-depth: 2
      # Bash, for pipefail: a failed diff fails the job rather than listing
      # nothing and skipping the repeat.
      - id: specs
        shell: bash
        run: |
          specs=$(git diff --name-only --diff-filter=AMR HEAD^1 HEAD -- 'apps/web/e2e/*.spec.ts' | tr '\n' ' ')
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

  # Runs each changed spec file five more times, as a test that fails one
  # run in five passes the main run four times out of five. Only the files
  # themselves: a changed helper would repeat the whole suite.
  e2e-repeat:
    needs: e2e-changes
    if: needs.e2e-changes.outputs.specs != ''
    runs-on: ubuntu-latest
    # A PR that changes most specs repeats nearly the whole suite.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container: *playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: e2e
        run: pnpm test:e2e $SPECS --repeat-each=5 --shard=${{ matrix.shard }}/3
        env:
          SPECS: ${{ needs.e2e-changes.outputs.specs }}
      - if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-repeat-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The ruleset requires a check named e2e, and a matrix reports one per
  # shard. A skipped job counts as passed, so this runs whatever the shards
  # did, in a cancelled run too, and passes only if all of them did. The
  # repeat is skipped on main and on a PR that changes no spec, but must
  # not fail.
  e2e:
    if: ${{ always() }}
    needs: [e2e-shard, e2e-changes, e2e-repeat]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          test "$SHARDS" = success
          for result in "$CHANGES" "$REPEAT"; do
            [[ $result = success || $result = skipped ]]
          done
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
          CHANGES: ${{ needs.e2e-changes.result }}
          REPEAT: ${{ needs.e2e-repeat.result }}

  # Builds and smoke-tests the image on every run, so a broken Dockerfile
  # fails the PR rather than the deploy.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The instance rules: no published ports, container names or named
      # volumes, so two instances on one host never collide.
      - name: Check the Compose file
        run: |
          config=$(COMPOSE_PROJECT_NAME=ci docker compose --env-file .env.example config --format json)
          jq -e '[.services[] | select(.ports or .container_name)] == []' <<<"$config"
          jq -e '.volumes == null' <<<"$config"
          jq -e '[.services[].volumes[]? | select(.type != "bind")] == []' <<<"$config"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: shylog:ci
          # As publish passes it, so publish reuses this build's cache.
          build-args: VITE_REVISION=${{ github.sha }}
          cache-from: type=gha
          # Only main writes the cache, so PR builds can't evict the layers
          # publish reuses.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - run: .github/scripts/smoke-image.sh shylog:ci "$REVISION"
        env:
          REVISION: ${{ github.sha }}

  # Publishes only from main and only once every check has passed. It
  # rebuilds from the image job's cache, so with the pinned base images and
  # frozen lockfile it is the same build as the one tested.
  publish:
    if: github.event_name == 'push'
    needs: [check, e2e, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: VITE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          # Lets a host read which commit latest is from its config alone.
          # A label changes only the config, not the layers, so this is
          # still the tested build.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
